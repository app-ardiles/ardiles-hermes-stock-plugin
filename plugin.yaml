name: ardiles-stock
version: 2.4.1
manifest_version: 2
api_version: 1

description: >
  Ardiles Stock Expertise AI tools.
  Reads published Ardiles stock history through the Ardiles AI Platform,
  including current stock, historical snapshots, valuation, comparison,
  perubahan stok between snapshots, flexible read-only analysis,
  and guarded human-approved skill learning.

provides_tools:
  - search_stock_item
  - get_model_variants
  - get_stock_detail
  - get_stock_by_location
  - get_stock_by_accsys
  - get_location_summary
  - get_stock_data_status
  - get_stock_snapshots
  - stock_query
  - stock_summary
  - stock_valuation
  - stock_rank
  - stock_compare
  - stock_changes
  - stock_data_health
  - query_ardiles_data

config_schema:
  base_api_url:
    type: str
    label: Ardiles AI Platform Base URL
    description: >
      Base production URL for the Ardiles AI Platform,
      for example https://ardiles-ai-platform.vercel.app
    default: ""
    required: true

  api_key:
    type: secret
    env: ARDILES_API_KEY
    label: Ardiles API Key
    description: >
      Secret credential used by Ardiles Stock Expertise AI
      to authenticate to the Ardiles AI Platform.
    required: true

  skill_update_telegram_ids:
    type: str
    label: Authorized Telegram IDs for Skill Update
    description: >
      Comma-separated numeric Telegram user IDs allowed to approve
      shared skill updates. Keep this empty in source control and
      configure it only on the Hermes ardiles-stock profile.
    default: ""
    required: false
